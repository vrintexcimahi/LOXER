plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'id.web.loxer.app'
    compileSdk 35

    defaultConfig {
        applicationId "id.web.loxer.app"
        minSdk 24
        targetSdk 35
        versionCode 2
        versionName "1.1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        buildConfigField "String", "APP_BASE_URL", "\"https://app.loxer.id\""
        buildConfigField "String", "FALLBACK_WEB_URL", "\"https://loxer.web.id\""
        buildConfigField "String", "API_BASE_URL", "\"https://api.loxer.id\""
        buildConfigField "String", "REMOTE_CONFIG_URL", "\"https://api.loxer.id/mobile/config\""
    }

    signingConfigs {
        release {
            def keystorePath = System.getenv("ANDROID_KEYSTORE") ?: "/home/vrintex/loxer/android-release/loxer-release.keystore"
            def keystorePassword = System.getenv("ANDROID_STORE_PASSWORD") ?: "LoxerProduction2026!"
            def keyAliasName = System.getenv("ANDROID_KEY_ALIAS") ?: "loxer"
            def keyPasswordStr = System.getenv("ANDROID_KEY_PASSWORD") ?: "LoxerProduction2026!"

            if (file(keystorePath).exists()) {
                storeFile file(keystorePath)
                storePassword keystorePassword
                keyAlias keyAliasName
                keyPassword keyPasswordStr
            }
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
            debuggable true
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            def keystorePath = System.getenv("ANDROID_KEYSTORE") ?: "/home/vrintex/loxer/android-release/loxer-release.keystore"
            if (file(keystorePath).exists()) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        buildConfig true
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.activity:activity-ktx:1.9.0'
    implementation 'androidx.webkit:webkit:1.11.0'
    implementation 'androidx.browser:browser:1.8.0'
    implementation 'androidx.biometric:biometric:1.2.0-alpha05'
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
}
