<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
    <title>LOXER - Platform Rekrutmen Indonesia</title>
    <meta
      name="description"
      content="Platform rekrutmen Indonesia - lamar pekerjaan 1 klik, tanpa upload CV. Temukan karir impian bersama 8.000+ perusahaan terpilih."
    />
    <!-- PWA & Android Native App Settings -->
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="icon" type="image/png" sizes="32x32" href="/branding/icon32.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/branding/icon192.png" />
    <meta name="theme-color" content="#0F172A" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#0284c7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0284c7" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="LOXER" />
    <meta name="application-name" content="LOXER" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <!-- Google Identity Services (GIS) for Native Google Sign-In -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script>
      // Force unregister all service workers and clean stale cache on localhost immediately
      if (typeof window !== 'undefined') {
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(function(regs) {
            for (var i = 0; i < regs.length; i++) {
              regs[i].unregister();
            }
          });
        }
        if ('caches' in window) {
          caches.keys().then(function(keys) {
            for (var i = 0; i < keys.length; i++) {
              caches.delete(keys[i]);
            }
          });
        }
      }
    </script>
  </head>
  <body style="background: #0f172a; margin: 0;">
    <div id="root">
      <div style="min-height: 100vh; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, #0f172a 0%, #0369a1 100%); color: #ffffff; font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
        <div style="text-align: center; padding: 20px;">
          <div style="width: 44px; height: 44px; border: 3px solid rgba(56, 189, 248, 0.2); border-top-color: #38bdf8; border-radius: 50%; animation: loxer-spin 0.8s linear infinite; margin: 0 auto 16px;"></div>
          <div style="font-weight: 800; font-size: 20px; letter-spacing: -0.5px; margin-bottom: 4px; color: #ffffff;">LOXER</div>
          <div style="font-size: 13px; color: #bae6fd;">Menyiapkan platform rekrutmen...</div>
          <div id="slow-recovery-box" style="display: none; margin-top: 18px;">
            <button onclick="window.location.reload(true)" style="background: rgba(56, 189, 248, 0.2); border: 1px solid rgba(56, 189, 248, 0.4); color: #e0f2fe; padding: 8px 18px; border-radius: 12px; font-size: 12px; font-weight: 600; cursor: pointer;">
              Muat Ulang Bersih
            </button>
          </div>
        </div>
      </div>
      <script>
        setTimeout(function() {
          var btn = document.getElementById('slow-recovery-box');
          if (btn) btn.style.display = 'block';
        }, 3000);
      </script>
      <style>
        @keyframes loxer-spin {
          to { transform: rotate(360deg); }
        }
      </style>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
