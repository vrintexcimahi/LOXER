  <head>

    <title>LOXER - Platform Rekrutmen Indonesia</title>
    <meta
      name="description"
      content="Platform rekrutmen Indonesia - lamar pekerjaan 1 klik, tanpa upload CV. Temukan karir impian bersama 8.000+ perusahaan terpilih."
    />
    <link rel="apple-touch-icon" sizes="180x180" href="/branding/icon192.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/branding/icon192.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="/branding/icon512.png" />
    <meta name="theme-color" content="#0F172A" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#0284c7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0284c7" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <!-- Google Identity Services (GIS) for Native Google Sign-In -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script>
      function purgeLoxerCachesAndReload() {
        try {
          var now = Date.now();
          var lastRetry = parseInt(sessionStorage.getItem('loxer_chunk_retry') || '0', 10);
          if (now - lastRetry < 15000) {
            console.warn('[LOXER] Reload loop dicegah (cooldown 15s aktif).');
            return;
          }
          sessionStorage.setItem('loxer_chunk_retry', String(now));

          var p = [];
          if ('serviceWorker' in navigator) {
            p.push(navigator.serviceWorker.getRegistrations().then(function(regs) {
              return Promise.all(regs.map(function(r) { return r.unregister(); }));
            }));
          }
          if ('caches' in window) {
            p.push(caches.keys().then(function(names) {
              return Promise.all(names.map(function(k) { return caches.delete(k); }));
            }));
          }
          Promise.all(p).finally(function() {
            var target = window.location.pathname + '?nocache=' + Date.now();
            window.location.replace(target);
          });
          return;
        } catch (e) {
          window.location.reload();
        }
      }

      // Global error listener khusus kegagalan load dynamic chunk module (anti looping)
      window.addEventListener('error', function(e) {
        var msg = (e && e.message) ? e.message.toLowerCase() : '';
        if (msg.indexOf('failed to fetch dynamically imported module') !== -1 ||
            msg.indexOf('error loading dynamically imported module') !== -1) {
          var now = Date.now();
          var lastRetry = parseInt(sessionStorage.getItem('loxer_chunk_retry') || '0', 10);
          if (now - lastRetry > 15000) {
            purgeLoxerCachesAndReload();
          }
        }
      });

      window.addEventListener('unhandledrejection', function(e) {
        var reason = (e && e.reason) ? (e.reason.message || String(e.reason)).toLowerCase() : '';
        if (reason.indexOf('failed to fetch dynamically imported module') !== -1 ||
            reason.indexOf('error loading dynamically imported module') !== -1) {
          var now = Date.now();
          var lastRetry = parseInt(sessionStorage.getItem('loxer_chunk_retry') || '0', 10);
          if (now - lastRetry > 15000) {
            purgeLoxerCachesAndReload();
          }
        }
      });

      // Nonaktifkan Web PWA & Unregister seluruh residual Service Worker
      if (typeof window !== 'undefined' && 'serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(regs) {
          for (var i = 0; i < regs.length; i++) {
            regs[i].unregister();
          }
        });
      }
    </script>
  </head>
  <body style="background: #0f172a; margin: 0;">
    <div id="root">
      <div style="min-height: 100vh; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, #0f172a 0%, #0369a1 100%); color: #ffffff; font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
        <div style="text-align: center; padding: 20px;">
          <div style="width: 44px; height: 44px; border: 3px solid rgba(56, 189, 248, 0.2); border-top-color: #38bdf8; border-radius: 50%; animation: loxer-spin 0.8s linear infinite; margin: 0 auto 16px;"></div>
          <div style="font-weight: 800; font-size: 20px; letter-spacing: -0.5px; margin-bottom: 4px; color: #ffffff;">LOXER</div>
          <div id="loading-status-text" style="font-size: 13px; color: #bae6fd;">Menyiapkan platform rekrutmen...</div>
          <div id="slow-recovery-box" style="display: none; margin-top: 18px;">
            <button onclick="purgeLoxerCachesAndReload()" style="background: rgba(56, 189, 248, 0.2); border: 1px solid rgba(56, 189, 248, 0.4); color: #e0f2fe; padding: 8px 18px; border-radius: 12px; font-size: 12px; font-weight: 600; cursor: pointer; transition: all 0.2s;">
              Muat Ulang Bersih
            </button>
          </div>
        </div>
      </div>
      <script>
        setTimeout(function() {
          var btn = document.getElementById('slow-recovery-box');
          if (btn) btn.style.display = 'block';
          var txt = document.getElementById('loading-status-text');
          if (txt) txt.textContent = 'Menyinkronkan versi terbaru...';
        }, 3000);
      </script>
      <style>
        @keyframes loxer-spin {
          to { transform: rotate(360deg); }
        }
      </style>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
